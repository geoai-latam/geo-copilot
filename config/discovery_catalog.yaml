# =============================================================================
# Discovery Catalog — multi-región
# =============================================================================
# Catálogo de entidades oficiales, publicadores y zonas usado por el
# DiscoveryAgent para mapear menciones en lenguaje natural a filtros de
# búsqueda en ArcGIS Hub (`filter[source]`, `filter[owner]`, `filter[tags]`).
#
# Estructura:
#   default_region: <key>          # qué región se usa cuando el usuario no
#                                    especifica país/región explícita
#   regions:
#     <region_key>:
#       label: <nombre legible>
#       country_bbox: [minLon, minLat, maxLon, maxLat]  # opcional
#       entities:                  # organizaciones oficiales
#         <ENTITY_KEY>:
#           aliases: [...]         # variantes coloquiales para detección NL
#           owners: [...]          # cuentas AGOL/Hub conocidas
#           sources: [...]         # texto en el campo `source` de Hub items
#           tags: [...]            # tags institucionales que esos items llevan
#       publishers: [...]          # publicadores adicionales del país que
#                                    no mapean a una entidad pero son fuentes
#                                    de datos oficiales/semi-oficiales
#       zones:                     # áreas geográficas (ciudades/regiones)
#         <ZONE_KEY>:
#           label: <nombre>
#           bbox: [minLon, minLat, maxLon, maxLat]
#           aliases: [...]         # variantes para detección NL
#           tags: [...]            # tags que Hub publishers usan para esa zona
#
# Cómo añadir un nuevo país:
#   Solo edita este archivo. No requiere cambio de código.
#
# Cómo cambiar el país por defecto del producto:
#   Cambia `default_region` a la key correspondiente.
#
# Para soporte "global" (sin sesgo regional):
#   Pasa `region: null` o `global_mode: true` en los hints del DiscoveryAgent.
# =============================================================================

default_region: colombia

regions:
  # ---------------------------------------------------------------------------
  # COLOMBIA
  # ---------------------------------------------------------------------------
  colombia:
    label: Colombia
    country_bbox: [-81.85, -4.23, -66.85, 13.41]

    entities:
      IGAC:
        aliases: [igac, codazzi, instituto geografico, instituto geográfico]
        owners:
          - IGAC.Comunicaciones
          - igac_oit
          - IGAC_Geoportal
          - IGAC_Cartografia
        sources:
          - Instituto Geográfico Agustín Codazzi
          - IGAC - Instituto Geográfico Agustín Codazzi
        tags: [IGAC, Instituto Geográfico Agustín Codazzi, Codazzi]

      DANE:
        aliases: [dane]
        owners: [DANE_Colombia, DANEColombia]
        sources: [Departamento Administrativo Nacional de Estadística]
        tags: [DANE, Censo, Censo 2018, Censo Agropecuario]

      IDEAM:
        aliases: [ideam]
        owners: [IDEAMColombia, ideam_oficial]
        sources: ["Instituto de Hidrología, Meteorología y Estudios Ambientales"]
        tags: [IDEAM, Hidrología, Meteorología]

      MADS:
        aliases: [minambiente, ministerio de ambiente, mads]
        owners: [MinAmbienteCO, minambiente_co]
