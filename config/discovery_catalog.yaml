      - Infraestructura de Datos Espaciales de Cundinamarca
      - Alcaldía de Mosquera
      - Alcaldía de Funza
      - Universidad Distrital Francisco Jose de Caldas
      - Distrito Especial de Medellín
      - Catastro Distrital de Bogotá
      - Secretaria Distrital de Movilidad
      - Camacol Bogotá y Cundinamarca

    zones:
