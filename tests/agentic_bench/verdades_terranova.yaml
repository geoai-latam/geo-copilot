# Batería de VERDADES con Terranova (plan de fiabilidad del agente, docs/PLAN_FIABILIDAD_AGENTE_2026-10-24.md).
#
# Preguntas que GEO Copilot responde con las herramientas de Terranova (MCP por familia). Cada cifra se
# midió aparte en la fuente oficial (datos.gov.co, ArcGIS de las entidades, BanRep, USGS), no a través
# de Terranova ni del agente. Además de la cifra, se mide lo que falló en el diagnóstico del 2026-10-23:
#
# - enrutamiento: preguntas de datos que el router contestaba de memoria (`direct_response`), sin
#   herramienta; se exige `tool_regex` (que haya consultado) y, si aplica, la cifra.
# - juez: la crítica entraba como mensaje del usuario y la respuesta empezaba «Tienes razón»;
#   todas las tareas prohíben ese giro.
# - mapa: una capa que no se pintó se contaba como éxito; se exige la capa (`result_kind: geojson`).
# - ambigüedad: un nombre con varios lugares; la respuesta debe preguntar o decir qué asumió.
# - descubrimiento: herramientas que existen y el agente no encontraba.
#
# Corre con el grafo de la APP (servidores tn_* de Terranova) y N repeticiones:
#   python tests/agentic_bench/runner.py --app --tasks tests/agentic_bench/verdades_terranova.yaml \
#       --repeticiones 3 --out bench_results --label <etiqueta>
# Las verdades que crecen con el tiempo (SECOP, RUES) usan rango; si la fuente cambia, se vuelve a
# medir y se actualiza el valor (nunca se ajusta la verdad a lo que respondió el agente).
#
# Prohibido en todas: dirigirse al usuario como si hubiera reclamado (lo produce el juez).
#   answer_not_regex común: '(?i)tienes raz[oó]n|s[ií] puedo corregirlo'

# ------------------------------------------------------------ geográficas (Terranova territorio/ambiente)
- id: tn-geo-predio-punto
