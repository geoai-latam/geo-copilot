# Benchmark agéntico de GEO_COPILOT — 32 tareas NL end-to-end.
#
# Cada tarea corre contra el grafo REAL (LLM real + BD real + sandbox) con
# estado fresco. `setup` precarga contexto (capas sintéticas deterministas,
# historial, feature seleccionada). `expected` son checks DETERMINISTAS que
# evalúa evaluator.py — ver ese módulo para el vocabulario completo.
#
# BD real de referencia (no cambiar las tareas sin verificarla):
#   catastro.lotes          933.473 filas (objectid, lotcodigo, manzcodigo, lotdistrit, …)
#   catastro.construcciones 2.409.199 filas (connpisos, conaltura, connsotano, lotecodigo, …)
#
# `flaky: true` = depende de red externa (ArcGIS Hub); su fallo se reporta
# pero NO baja el score principal (score_strict lo incluye).

# ---------------------------------------------------------------- simple (5)
- id: simple-count-lotes
  category: simple
  query: "¿cuántos lotes hay en total en la base de datos?"
  expected:
    success: true
    intent_any: [query_data]
    intent_optional_react: true
    trajectory_contains: [gis_agent]
    sql_regex: "count"
    min_results: 1

- id: simple-select-25
  category: simple
  query: "muéstrame 25 lotes de catastro"
  expected:
    success: true
    sql_regex: "limit"
    result_kind: geojson
    max_results: 25

- id: simple-filtro-pisos
  category: simple
  query: "trae las construcciones con más de 10 pisos, máximo 50"
  expected:
    success: true
    sql_regex: "connpisos"
    min_results: 1
    max_results: 50

- id: simple-que-entidades
  category: simple
  query: "¿qué datos tengo disponibles en la base de datos?"
  expected:
    success: true
    answer_regex: "lotes|construccion"

- id: simple-lotes-de-manzana
  category: simple
  query: "dame los primeros 10 lotes de la manzana con manzcodigo 002412028"
  expected:
    success: true
    sql_regex: "manzcodigo"
    min_results: 1
    max_results: 10

