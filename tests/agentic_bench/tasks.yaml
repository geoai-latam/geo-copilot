# --------------------------------------------------------------- followup (3)
- id: follow-campos-previos
  category: followup
  query: "¿qué campos tenían esos resultados que me mostraste?"
  setup:
    active_data_source: internal
    conversation_history:
      - role: user
        content: "trae 50 lotes de catastro"
      - role: assistant
        content: "Se encontraron 50 lotes en la capa 'Lotes'."
    previous_sql: "SELECT objectid, lotcodigo, manzcodigo FROM catastro.lotes LIMIT 50"
    previous_results:
      - {objectid: 1, lotcodigo: "001", manzcodigo: "00A"}
      - {objectid: 2, lotcodigo: "002", manzcodigo: "00B"}
  expected:
    success: true
    intent_any: [follow_up, direct_response]
    intent_optional_react: true
    no_sql: true
    answer_regex: "lotcodigo|manzcodigo|objectid"

- id: follow-feature-seleccionada
  category: followup
  query: "dame todos los datos del lote que seleccioné en el mapa"
  setup:
    active_data_source: internal
    conversation_history:
      - role: user
        content: "trae 50 lotes de catastro"
      - role: assistant
        content: "Se encontraron 50 lotes en la capa 'Lotes'."
    map_context:
      selected_feature:
        layer_id: "Lotes"
        properties: {objectid: 841176, lotcodigo: "002412028019", manzcodigo: "002412028"}
  expected:
    success: true
    sql_regex: "lotcodigo|objectid"
    min_results: 1

- id: follow-saludo-capacidades
  category: followup
  query: "hola, ¿qué sabes hacer?"
  expected:
    success: true
    intent_any: [direct_response]
    intent_optional_react: true
    no_sql: true
    result_kind: text_only

