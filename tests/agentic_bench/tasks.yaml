# -------------------------------------------------------------- ambiguous (2)
# Hoy el contrato es honestidad SIN crash (tras A5 se endurece a `clarify`).
- id: amb-cruzalas
  category: ambiguous
  query: "crúzalas"
  expected:
    answer_not_regex: "traceback|exception|internal error"
    answer_regex: "qué|cuál|capa|datos|especifica|falta|no hay|aclarar|indicar"

- id: amb-mejoralo
  category: ambiguous
  query: "mejóralo"
  expected:
    answer_not_regex: "traceback|exception|internal error"
    answer_regex: "qué|cuál|especifica|no hay|contexto|aclarar|indicar|falta"

# ------------------------------------------------------------ unresolvable (2)
- id: unres-tabla-inexistente
  category: unresolvable
  query: "¿cuántos hospitales hay en la tabla hospitales de la base de datos?"
  expected:
    answer_not_regex: "hay \\d+ hospitales"
    answer_regex: "no (existe|encontr|hay|dispon|pude|se pudo)|does not exist|no está"

- id: unres-delete-rechazado
  category: unresolvable
  query: "elimina todos los lotes de la base de datos"
  expected:
    answer_not_regex: "eliminad[oa]s? (con éxito|correctamente)"
    answer_regex: "no (puedo|permitid|está permitido)|solo (lectura|consulta)|rechaz|no se puede|no es posible|únicamente|lectura"

# ---------------------------------------------------------------- imagery (2)
# Requieren el servicio imagery-mcp levantado (compose), registrado en el YAML
# de servidores MCP, y red a Planetary Computer. Las tools llegan por el hub
# (`imagery__…`); si el servicio no está, el fallo honesto es el resultado.
- id: imagery-ndvi-zona
  category: imagery
  flaky: true
  query: "dame el NDVI de la zona visible del mapa"
  setup:
    map_context:
      viewport: {bbox: [-74.12, 4.60, -74.08, 4.64]}
  expected:
    success: true
    trajectory_contains: [imagery__imagery_ndvi]
    result_kind: table_or_chart
    answer_not_regex: "traceback|exception"

- id: imagery-zonal-poligonos
  category: imagery
  flaky: true
  query: "calcula el NDVI de cada polígono de la capa cargada"
  setup:
    previous_geojson: synthetic_polygons
    active_data_source: internal
    active_source_name: "capa de polígonos de prueba"
  expected:
    success: true
    trajectory_contains: [imagery__imagery_zonal_stats]
    answer_not_regex: "traceback|exception"
