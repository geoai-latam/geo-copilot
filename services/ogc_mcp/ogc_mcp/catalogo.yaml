# Catálogo curado de servicios OGC oficiales de Colombia.
# Cada entrada se verificó en vivo (GetCapabilities por protocolo, con reintentos) la fecha de
# `verificado`; las descripciones dicen las capas que el servicio realmente publica ese día.
# Verificación: tests/test_ogc_mcp_vivo.py (marca `integration`: `pytest -m integration`).
# Fuera a propósito: geodesia/redgeodesicanacional (0 capas) y SGC catalogo_de_sismos_2 (sin WMS/WFS).

