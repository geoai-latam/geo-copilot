[project]
name = "geo-mcp-kit"
version = "0.1.0"
description = "Base común de los servidores GeoMCP de GEO_COPILOT: auth con scopes, rate limit, timeouts, contrato GeoResult."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# F6: aceptar tokens OIDC de usuarios (oidc.VerificadorJwt)
oidc = ["pyjwt[crypto]>=2.10.1"]
# F7 (S7.3): continuar la traza del agente (se activa con OTEL_EXPORTER_OTLP_ENDPOINT)
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-asgi>=0.48b0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geo_mcp_kit"]
