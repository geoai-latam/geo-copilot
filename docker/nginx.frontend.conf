# nginx site config para el frontend de GEO_COPILOT.
#
# - Sirve el bundle estático de Vite por HTTPS (443); el 80 solo redirige.
# - Proxiea ``/api/*`` y ``/health`` al servicio ``app`` (FastAPI) y ``/ws/*`` con upgrade.
# - SPA fallback: cualquier path no-API cae a index.html.
#
# F6 (S6.1): nginx YA NO inyecta ninguna clave. Cada petición lleva el token del usuario
# (``Authorization: Bearer``, OIDC) y el WebSocket un ticket de un solo uso; el backend los
# verifica. Antes nginx era un BFF que ponía la API key global sin exigir nada (#11): quien
# alcanzara el puerto usaba la API entera.
#
# Es un TEMPLATE: la imagen oficial de nginx hace envsubst al arrancar de las variables
# DEFINIDAS en el entorno del contenedor (``${PUERTO_TLS_PUBLICO}``, ``${OIDC_ORIGEN}``);
# ``$host``, ``$request_uri``… no son variables de entorno y quedan intactas.

# F7 (S7.1/E7.2): el nombre `app` se RE-RESUELVE (DNS de Docker, cada 10 s). Antes se resolvía
# una sola vez al arrancar nginx: con varias réplicas solo veía las que existían entonces, y al
# recrear la app (IP nueva) nginx seguía mandando a la vieja → 502 hasta reiniciar el frontend.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    # ``app`` es el nombre del servicio FastAPI en docker-compose.yml (una o varias réplicas).
    zone backend 64k;
    server app:8000 resolve;
}

# HTTP: solo redirige a HTTPS (el puerto público puede no ser 443: lo dice la configuración).
server {
    listen 80;
    server_name _;
    server_tokens off;
    location = /health {
        proxy_pass http://backend/health;
    }
    location / {
        return 301 https://$host:${PUERTO_TLS_PUBLICO}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado: el de la organización montado en /etc/nginx/certs (tls.crt + tls.key). Si no
    # hay, el arranque genera uno AUTOFIRMADO de desarrollo (docker/nginx-cert-desarrollo.sh).
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # R0.10 (auditoría 2026-07-26, AUD-45): cabeceras de seguridad. `always` para que se
    # emitan también en respuestas de error.
    # -------------------------------------------------------------------------
    server_tokens off;
    # F6: con TLS, el navegador recuerda usar siempre HTTPS con este sitio.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # `fonts.googleapis.com` / `fonts.gstatic.com`: `src/styles/index.css:1` hace `@import` de
    # las fuentes; sin ellas la app desplegada se ve con tipografías de reserva.
    # `'unsafe-inline'`/`'unsafe-eval'` en script-src: HOY los necesitan el bundle de Vite y
    # MapLibre (shaders con eval); son los dos candados que faltan y exigen tocar el build.
    # `connect-src`: https:/wss: por las teselas externas declaradas en tiempo de ejecución, y
    # `${OIDC_ORIGEN}` (F6) porque el frontend pide el token al proveedor de identidad (en
    # desarrollo es http://localhost:8081, que `https:` no cubre).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ${OIDC_ORIGEN}; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # F7 (auditoría): `X-Forwarded-For` se SOBRESCRIBE con la IP que ve nginx, nunca se anexa a
    # la que manda el cliente (falsificable: con la primera entrada como clave, cada petición con
    # una IP inventada estrenaba bucket y el rate limit no se alcanzaba). La app toma la última
    # entrada y, en las rutas autenticadas, limita por usuario. Si algún día hay un balanceador
    # delante de nginx, la IP real se toma de él con `set_real_ip_from` + `real_ip_header`.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    location = /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST. La cabecera Authorization del navegador pasa tal cual (nginx no la toca).
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        # P0-A (audit Docker): válvula para respuestas geojson grandes; el cap del backend manda.
        client_max_body_size 50m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # F7 (auditoría): POST /query espera al turno hasta compute_process_timeout = cómputo +
        # aprobación humana (TOTAL_EXECUTION_TIMEOUT 120 + HITL_TIMEOUT 300 = 420 s), y después arma
        # la respuesta (workspace, sugerencias). Con 300 s nginx cortaba con un 504 propio un turno
        # que la app aún iba a responder. Si se suben esos tiempos, subir esto por encima.
        proxy_read_timeout 480s;
        proxy_send_timeout 480s;
    }

    # WebSocket: se abre con un ticket de un solo uso en la URL (no con el token). El log de
    # acceso de nginx lo registra, pero ya consumido no sirve para nada.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header en un location anula los del server: se repiten los de seguridad
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
