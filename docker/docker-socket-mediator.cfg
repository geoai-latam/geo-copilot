# Mediador del socket de Docker — R0.4 (auditoría 2026-07-26, AUD-02)
# =============================================================================
# Reemplaza a `tecnativa/docker-socket-proxy`, cuyo filtro es por SECCIÓN del
# API y no por endpoint. Con `CONTAINERS=1 POST=1` su única regla de ruta era
#
#     http-request allow if { path -m reg -i ^(/v[\d\.]+)?/containers } { env(CONTAINERS) }
#
# lo que dejaba permitidos `POST /containers/create`, `/containers/{id}/start`
# y `POST /containers/CUALQUIERA/exec`. Verificado empíricamente antes del
# cambio: `POST /containers/create` devolvía 400 del DAEMON ("invalid reference
# format"), no 403 del proxy — es decir, la petición atravesaba el filtro. Eso
# es root del host desde `app`, encadenando con el escape del sandbox (AUD-03).
#
# Aquí la política es una ALLOWLIST DE RUTA EXACTA: sólo lo que necesita
# `docker exec -i geo_copilot_sandbox python -I <runner>`. Todo lo demás, 403.
#
# Se mantiene haproxy (misma tecnología que el proxy anterior) a propósito: el
# `POST /exec/{id}/start` de Docker secuestra la conexión HTTP para hacer
# streaming de stdin/stdout, y esta base ya lo maneja correctamente en este
# despliegue. Cambiar de tecnología habría arriesgado el camino legítimo.
#
# R0.4b: además de ruta y método, se filtra el CUERPO del exec. Antes se podía
# enviar `"Privileged": true` o `"User": "0"` por HTTP crudo y el mediador lo
# reenviaba (medido: los tres daban 201, y `-u 0` conseguía uid=0 dentro del
# sandbox). Nota: `Privileged` NO recuperaba capacidades porque el contenedor
# lleva `no-new-privileges` —CapEff quedaba a cero— pero el campo se bloquea
# igual, para que la contención no dependa de un solo control.
# =============================================================================

global
    log stdout format raw daemon info
    # Sin `pidfile`: la imagen oficial corre como usuario `haproxy` (no root) y
    # no puede escribir en /run. En un contenedor el pid 1 ya es el proceso.
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    # Holgado: una ejecución del sandbox hace streaming por esta conexión.
    timeout client 10m
    timeout server 10m

backend dockersocket
    server docker /var/run/docker.sock

frontend dockerfrontend
    bind :2375

    # R0.4b: el cuerpo debe estar completo antes de inspeccionarlo.
    option http-buffer-request

    # --- handshake del cliente Docker -----------------------------------
    acl p_ping       path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$
    acl p_version    path,url_dec -m reg -i ^(/v[0-9.]+)?/version$

    # --- SOLO el contenedor sandbox, SOLO exec --------------------------
    acl p_sbx_json   path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/geo_copilot_sandbox/json$
    acl p_sbx_exec   path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/geo_copilot_sandbox/exec$
    acl p_exec_start path,url_dec -m reg -i ^(/v[0-9.]+)?/exec/[a-f0-9]+/start$
    acl p_exec_json  path,url_dec -m reg -i ^(/v[0-9.]+)?/exec/[a-f0-9]+/json$

    # --- R0.4b: campos del CUERPO que elevan privilegio ------------------
    # Se comprueban con `req.body` nativo (requiere `option http-buffer-request`
    # arriba). Se usó regex sobre el VALOR, no sobre el nombre del campo: el
    # cliente legítimo de Docker envía siempre `"User":""` y `"Privileged":false`,
    # así que denegar por nombre habría roto el camino del sandbox.
    # Las comillas van escapadas (\") porque el parser de haproxy usa " como
    # delimitador de cadena. Basta con mirar el PRIMER carácter del valor: un
    # `"User":""` legítimo no casa, un `"User":"0"` sí.
    acl cuerpo_privilegiado  req.body -m reg -i \"Privileged\"[[:space:]]*:[[:space:]]*true
    acl cuerpo_user_no_vacio req.body -m reg -i \"User\"[[:space:]]*:[[:space:]]*\"[^\"]
    acl cuerpo_workingdir    req.body -m reg -i \"WorkingDir\"[[:space:]]*:[[:space:]]*\"[^\"]
    acl cuerpo_hostconfig    req.body -m reg -i \"HostConfig\"[[:space:]]*:[[:space:]]*[{]

    http-request deny deny_status 403 if METH_POST p_sbx_exec cuerpo_privilegiado
    http-request deny deny_status 403 if METH_POST p_sbx_exec cuerpo_user_no_vacio
    http-request deny deny_status 403 if METH_POST p_sbx_exec cuerpo_workingdir
    http-request deny deny_status 403 if METH_POST p_sbx_exec cuerpo_hostconfig

    http-request allow if METH_GET  p_ping
    http-request allow if METH_GET  p_version
    http-request allow if METH_GET  p_sbx_json
    http-request allow if METH_GET  p_exec_json
    http-request allow if METH_POST p_sbx_exec
    http-request allow if METH_POST p_exec_start

    # Denegación por defecto. Cae aquí TODO lo no listado arriba:
    # /containers/create, /containers/json, /images, /networks, /volumes,
    # /exec sobre cualquier otro contenedor, DELETE, PUT, etc.
    http-request deny

    default_backend dockersocket
