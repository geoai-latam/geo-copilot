# F7 (S7.4): evaluaciones agénticas con LLM REAL — a mano (Actions → Run workflow) o, si la variable
# del repo EVALS_LLM es 'true', en los PR que tocan el juicio y como puerta de cada versión.
# Sin ejecución nocturna: cuesta tokens todos los días (decisión del dueño, 2026-10-06).
#
# La batería `-m llm` mide el JUICIO del agente (qué herramienta elige, qué afirma, si es honesto)
# con el modelo de producción. Sus tests son TASAS; por debajo del umbral la versión NO se publica
# (ci.yml la llama en las etiquetas v* antes de publicar las imágenes).
#
# Credenciales (Settings → Secrets and variables → Actions):
#   secrets:   AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT   (o OPENAI_API_KEY / ANTHROPIC_API_KEY)
#   variables: EVALS_LLM ('true' para activarlas en ci.yml), LLM_PROVIDER (azure),
#              LLM_MODEL (por defecto gpt-5.4-mini), OPENAI_API_VERSION, UMBRAL_EVALS (0.95)
#
# El bench de punta a punta (con PostGIS del catastro y sandbox) corre en el despliegue: ver
# scripts/evals_nocturnas.sh y el runbook.

name: Evaluaciones LLM

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      pruebas:
        # F0 del plan de calidad: en un PR que toca el juicio del agente corre un subconjunto
        description: "archivos de prueba (separados por espacio); por defecto, toda la batería"
        type: string
        default: "tests"

permissions:
  contents: read

jobs:
  juicio:
    name: Batería de juicio (LLM real)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'azure' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.4-mini' }}
      OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION || '2024-12-01-preview' }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # sin LLM no se «salta en verde»: falla (conftest)
      LLM_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ¿Hay credenciales del LLM?
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "::error::faltan las credenciales del LLM en los secretos del repositorio (ver cabecera de evals.yml)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,imagery]"
          pip install -e packages/geo_mcp_kit
          pip install -e packages/geo_sql_guard

      - name: Batería -m llm
        # el bench en host necesita el stack (rol mínimo de la BD): corre en el despliegue
        env:
          PRUEBAS: ${{ inputs.pruebas || 'tests' }}
        run: |
          # shellcheck disable=SC2086  # PRUEBAS es una lista de rutas separadas por espacio
          pytest -m llm $PRUEBAS -q -p no:randomly --no-cov -rf \
            --deselect tests/test_agentic_bench.py::test_bench_subset_host \
            --junitxml=evals.xml || true

      - name: Umbral
        run: python scripts/umbral_evals.py evals.xml --umbral "${{ vars.UMBRAL_EVALS || '0.95' }}"

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evals-${{ github.run_id }}
          path: evals.xml
